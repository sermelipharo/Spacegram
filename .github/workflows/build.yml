name: Build

on:
  workflow_dispatch:
  push:
    branches: [patches]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icon:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Telegram-Mac/AppIcon.icon
      - name: Compile app icon
        run: |
          xcodebuild -version
          mkdir -p out
          xcrun actool Telegram-Mac/AppIcon.icon --compile out --platform macosx --minimum-deployment-target 26.0 --app-icon AppIcon --output-partial-info-plist out/info.plist

  build:
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules
        run: |
          git config submodule.third-party/twidget.update none
          git config submodule.third-party/widget-sandbox.update none
          git submodule update --init --recursive

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Compute cache keys
        id: keys
        run: |
          SUBMODULES="$(git submodule status --recursive | shasum -a 256 | cut -d' ' -f1)"
          XCODE_HASH="$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)"
          echo "frameworks=frameworks-$XCODE_HASH-$SUBMODULES-" >> "$GITHUB_OUTPUT"
          echo "xcode=$XCODE_HASH" >> "$GITHUB_OUTPUT"
          echo "cas=compilation-cache-$XCODE_HASH-" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Prepare build environment
        run: |
          sed -i '' '/openssl@1.1/d' scripts/setup_build_env.sh
          sh scripts/setup_build_env.sh

      - name: Configure API credentials
        env:
          APP_API_ID: ${{ secrets.APP_API_ID }}
          APP_API_HASH: ${{ secrets.APP_API_HASH }}
        run: |
          test -n "$APP_API_ID" && test -n "$APP_API_HASH"
          python3 - <<'PY'
          import os, re, secrets
          path = 'packages/ApiCredentials/Sources/ApiCredentials/Config.swift'
          source = open(path).read()
          api_id = os.environ['APP_API_ID']
          secret = os.environ['APP_API_HASH'].encode()
          key = secrets.token_bytes(len(secret))
          data = bytes(a ^ b for a, b in zip(secret, key))
          array = lambda value: '[' + ', '.join(str(x) for x in value) + ']'
          source = source.replace('let key: [UInt8] = []', 'let key: [UInt8] = ' + array(key), 1)
          source = source.replace('let data: [UInt8] = []', 'let data: [UInt8] = ' + array(data), 1)
          source = re.sub(r'return 0\n', 'return ' + api_id + '\n', source, count=1)
          assert 'let key: [UInt8] = [' in source and 'let key: [UInt8] = []' not in source
          assert 'return ' + api_id + '\n' in source
          open(path, 'w').write(source)
          PY

      - name: Restore native frameworks
        id: restore-frameworks
        uses: actions/cache/restore@v4
        with:
          path: |
            core-xprojects/*/build
            packages/WalletEngine/wallet_engineFFI.xcframework
            submodules/telegram-ios/submodules/MTProtoRustEngine/MTProtoEngineFFI.xcframework
          key: ${{ steps.keys.outputs.frameworks }}restore
          restore-keys: |
            ${{ steps.keys.outputs.frameworks }}
            frameworks-${{ steps.keys.outputs.xcode }}-

      - name: Build native libraries
        id: frameworks
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: sh scripts/configure_frameworks.sh

      - name: Native framework stamps
        id: stamps
        if: always() && steps.frameworks.conclusion != 'skipped'
        run: |
          du -sh core-xprojects/*/build 2>/dev/null || true
          STAMPS="$(cat core-xprojects/*/build/.framework-stamp 2>/dev/null | shasum -a 256 | cut -d' ' -f1)"
          echo "key=${{ steps.keys.outputs.frameworks }}$STAMPS" >> "$GITHUB_OUTPUT"

      - name: Save native frameworks
        if: always() && steps.frameworks.outcome == 'success' && steps.stamps.outputs.key != steps.restore-frameworks.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            core-xprojects/*/build
            packages/WalletEngine/wallet_engineFFI.xcframework
            submodules/telegram-ios/submodules/MTProtoRustEngine/MTProtoEngineFFI.xcframework
          key: ${{ steps.stamps.outputs.key }}

      - name: Restore compilation cache
        id: restore-cas
        uses: actions/cache/restore@v4
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ steps.keys.outputs.cas }}${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.cas }}

      - name: Build app
        id: build-app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Telegram-Mac.xcworkspace \
            -scheme Telegram \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS="$PWD/ci/Telegram-adhoc.entitlements" \
            OTHER_SWIFT_FLAGS='$(inherited) -D GITHUB' \
            build 2>&1 | tee xcodebuild.log | grep -E '(error:|warning: unable|BUILD (SUCCEEDED|FAILED))' || true
          du -sh build/DerivedData/* 2>/dev/null || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log

      - name: Save compilation cache
        if: always() && steps.build-app.conclusion != 'skipped' && steps.restore-cas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ steps.keys.outputs.cas }}${{ github.sha }}

      - name: Package
        id: package
        run: |
          APP="$(find build/DerivedData/Build/Products -maxdepth 2 -name '*.app' | head -1)"
          echo "Built: $APP"
          NAME="Spacegram-${{ github.run_number }}-$(echo "${{ github.sha }}" | cut -c1-7).zip"
          ditto -c -k --keepParent "$APP" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Spacegram
          path: ${{ steps.package.outputs.name }}
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Publish release
        if: github.ref == 'refs/heads/patches'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.package.outputs.name }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Spacegram build ${{ github.run_number }}" \
            --notes "$(git log -1 --format='%h %s')"
